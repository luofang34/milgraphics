name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: fmt → clippy → test → doc → release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/check.sh

  wasm-browser:
    name: behaviour tests in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      # The runner image provides chromedriver under $CHROMEWEBDRIVER.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" tools/ci/wasm-test.sh

  lint:
    name: clippy on beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: builds and tests on rust-version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --lib
      - run: cargo build --locked --lib --target wasm32-unknown-unknown
      - run: cargo test --locked --all-targets

  features:
    name: every feature combination builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check -p milgraphics --feature-powerset --no-dev-deps
      - run: cargo hack check -p milgraphics --feature-powerset --no-dev-deps --target wasm32-unknown-unknown

  oracle:
    name: regenerate oracle fixtures from pinned mil-sym-java and diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Fixtures match the pinned oracle
        run: |
          for cases in tools/oracle/cases/*.tsv; do
            name=$(basename "$cases" .tsv)
            tools/oracle/oracle.sh "$cases" > "/tmp/$name.jsonl"
            python3 -I tools/oracle/diff-fixtures.py "tests/fixtures/oracle/$name.jsonl" "/tmp/$name.jsonl"
          done
