name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: fmt → clippy → test → doc → release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/check.sh

  wasm-browser:
    name: behaviour tests in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      # The runner image provides chromedriver under $CHROMEWEBDRIVER.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" tools/ci/wasm-test.sh

  lint:
    name: clippy on beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: library builds on rust-version (1.85)
    runs-on: ubuntu-latest
    # Dev-dependencies (criterion, proptest) may need a newer toolchain;
    # the promise to consumers covers the library.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --lib
      - run: cargo build --locked --lib --target wasm32-unknown-unknown
      - run: cargo clippy --locked --lib -- -D warnings

  features:
    name: every feature combination builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check -p milgraphics --feature-powerset --no-dev-deps
      - run: cargo hack check -p milgraphics --feature-powerset --no-dev-deps --target wasm32-unknown-unknown

  public-api:
    name: public API matches its snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-public-api reads one rustdoc JSON format version: pin both.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-06
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/public-api.sh

  package:
    name: crates.io package builds and tests alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/changelog.sh
      - run: cargo publish --locked --dry-run -p milgraphics
      - run: cargo package --locked --no-verify -p milgraphics
      - name: Package stays small and omits development tooling
        run: |
          crate=target/package/milgraphics-$(cargo pkgid -p milgraphics | sed 's/.*[#@]//').crate
          size=$(stat -c %s "$crate")
          echo "$crate: $size bytes"
          test "$size" -lt 3000000
          if tar -tzf "$crate" | grep -E '/(\.github|tools/ci|tools/oracle/java)/'; then
            echo "::error::development tooling must stay in the repository"
            exit 1
          fi
          echo "CRATE=$crate" >> "$GITHUB_ENV"
      # Every test that ships must compile and run from the packaged files.
      - name: Tests run from the packaged crate
        run: |
          mkdir -p /tmp/pkg
          tar -xzf "$CRATE" -C /tmp/pkg
          cd /tmp/pkg/milgraphics-*
          CARGO_TARGET_DIR=/tmp/pkg/target cargo test --locked --release --all-targets
          CARGO_TARGET_DIR=/tmp/pkg/target cargo test --locked --release --doc

  oracle:
    name: regenerate oracle fixtures from pinned mil-sym-java and diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fixtures match the pinned oracle
        run: |
          for cases in tools/oracle/cases/*.tsv; do
            name=$(basename "$cases" .tsv)
            # The large set is stored without GeoJSON and with 0.01 px coordinates.
            if [ "$name" = all ]; then export ORACLE_COMPACT=1; else unset ORACLE_COMPACT; fi
            tools/oracle/oracle.sh "$cases" > "/tmp/$name.jsonl"
            python3 -I tools/oracle/diff-fixtures.py "tests/fixtures/oracle/$name.jsonl" "/tmp/$name.jsonl"
          done
      - name: Generated case list matches the pinned catalog
        run: |
          tools/oracle/oracle.sh --cases 2>/dev/null | diff - tools/oracle/cases/all.tsv
      - name: Generated catalog matches the pinned data
        run: |
          tools/oracle/fetch-upstream.sh
          cargo xtask catalog
          cargo xtask references
          cargo xtask specs
          git diff --exit-code -- src/generated
